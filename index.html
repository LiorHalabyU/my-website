<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cost Manager</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <header>
        <h1>Cost Manager</h1>
    </header>
    <div class="dashboard">
        <div class="card">
            <h2>Add Cost Item</h2>

            <form id="addCostForm">
                <div class="input-label-box">
                    <label for="sum">Sum</label>
                    <input type="number" id="sum" placeholder="Sum" required min="0" step="0.01">
                </div>

                <div class="input-label-box">
                    <label for="currency">Currency</label>
                    <select id="currency" required>
                        <option value="USD">USD</option>
                        <option value="ILS">ILS</option>
                        <option value="GBP">GBP</option>
                        <option value="EURO">EURO</option>
                    </select>
                </div>

                <div class="input-label-box">
                    <label for="category">Category</label>
                    <input type="text" id="category" placeholder="Category" required>
                </div>

                <div class="input-label-box">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="Description" required>
                </div>

                <button type="submit">Add Cost</button>
            </form>
        </div>

        <div class="card">
            <h2>Report & Charts</h2>
            <form id="reportForm">
                <div class="input-label-box">
                    <label for="filterYear">Year</label>
                    <input type="number" id="filterYear" placeholder="Year" required>
                </div>

                <div class="input-label-box">
                    <label for="filterMonth">Month</label>
                    <select id="filterMonth" required>
                        <option value="1">Jan</option>
                        <option value="2">Feb</option>
                        <option value="3">Mar</option>
                        <option value="4">Apr</option>
                        <option value="5">May</option>
                        <option value="6">Jun</option>
                        <option value="7">Jul</option>
                        <option value="8">Aug</option>
                        <option value="9">Sep</option>
                        <option value="10">Oct</option>
                        <option value="11">Nov</option>
                        <option value="12">Dec</option>
                    </select>
                </div>

                <div class="input-label-box">
                    <label for="filterCurrency">Currency</label>
                    <select id="filterCurrency" required>
                        <option value="USD">USD</option>
                        <option value="ILS">ILS</option>
                        <option value="GBP">GBP</option>
                        <option value="EURO">EURO</option>
                    </select>
                </div>
            </form>

            <div class="report-table">
                <table id="reportTable">
                    <thead>
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Original Cost</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <p id="totalReportSum" class="total-sum"></p>
            </div>

            <div class="charts-row">
                <div class="chart-box">
                    <h3>Monthly Cost by Category</h3>
                    <div class="canvas-wrapper">
                        <p id="pieChartEmptyMsg" class="empty-chart-message" style="display: none;">No costs found for this month</p>
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>

                <div class="chart-box">
                    <h3>Yearly Costs by Month</h3>
                    <div class="canvas-wrapper">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </div>
        </div>



        <div class="card">
            <h2>Settings</h2>
            <div class="settings-box">
                <div class="input-label-box">
                    <label for="ratesUrl">Enter Exchange Rates URL:</label>
                    <input type="url" id="ratesUrl">
                </div>

                <button id="saveSettings">Save Settings</button>
            </div>
            <p>Leave empty and save to use default URL rates</p>
        </div>
    </div>

    <script src="db.js"></script>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>
</html>
